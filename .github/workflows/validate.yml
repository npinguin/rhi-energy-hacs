name: Validate HACS Distribution
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distribution-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          ignore: description topics license
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Exact protected inventory and rebuild corresponding frontend
        run: |
          python frontend-source/tools/build.py
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('custom_components/rhi_energy')
          p=json.loads(Path('DISTRIBUTION_SOURCE.json').read_text())
          assert p['status']=='PROTECTED_TEST_CANDIDATE' and not p['approved_release']
          assert set(p['platforms'])=={'x86_64','aarch64'}
          assert json.loads((root/'manifest.json').read_text())['version']==p['manifest_version']
          assert p["source_release"] == "E" + p["manifest_version"]
          assert p["shared_baseline"] and p["shared_baseline_checksum"].startswith("sha256:")
          files={f.relative_to(root).as_posix():hashlib.sha256(f.read_bytes()).hexdigest() for f in root.rglob('*') if f.is_file()}
          assert files==p['runtime_files']
          assert {k for k in files if k.endswith('.py')}==set(p['readable_native_adapters'])
          assert not set(p['protected_modules']) & files.keys()
          assert len([k for k in files if k.endswith('.so')])==2*len(p['protected_modules'])
          branding_files={f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in (Path('brand')).iterdir() if f.is_file()}
          assert branding_files==p['branding_files'], 'Branding provenance mismatch'
          assert set(branding_files)=={f.name for f in (root/'brand').iterdir() if f.is_file()}
          for f in (root/'brand').iterdir():
              assert f.read_bytes()==(Path('brand')/f.name).read_bytes(), 'HACS root branding differs'
          for f in Path('frontend-source/dist').rglob('*'):
              if f.is_file():
                  assert f.read_bytes()==(root/'frontend'/f.relative_to('frontend-source/dist')).read_bytes()
          assert (root/'frontend/LICENSE').read_bytes()==Path('frontend-source/LICENSE').read_bytes()
          print('Exact protected runtime and reproducible GPL frontend PASS')
          PY
